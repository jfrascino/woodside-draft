<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Draft War Room</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface2:#E9EDF1; --ink:#141C24; --muted:#5B6B7B; --line:#D8DFE6; --line2:#C6CFD8;
  --accent:#0E7C7B; --accent-ink:#FFFFFF; --accent-soft:#D9EFEE; --hot:#E4572E; --hot-ink:#FFFFFF; --hot-soft:#FBE3DB;
  --tough:#C8452C; --mid:#9AA5AF; --easy:#2E9E5E;
  --good:#2E9E5E; --warn:#C98A12; --bad:#C8452C;
  --QB:#7E5BD1; --RB:#2F8F5B; --WR:#2F6FC4; --TE:#D0782B; --K:#B9407A; --DST:#A87A2E;
  --shadow:0 8px 30px rgba(20,28,36,.14);
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Source Sans 3","Source Sans Pro","Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141A; --surface:#18212A; --surface2:#1F2A35; --ink:#E6ECF1; --muted:#93A3B2; --line:#27333F; --line2:#344251;
    --accent:#2FB8B4; --accent-ink:#0B1418; --accent-soft:#143a3a; --hot:#FF7A55; --hot-ink:#1A0E08; --hot-soft:#4a2419;
    --tough:#E0664B; --mid:#6F7D8A; --easy:#48BD7A;
    --good:#48BD7A; --warn:#E0A83A; --bad:#E0664B;
    --QB:#8F76DD; --RB:#3FA06A; --WR:#5A8ED8; --TE:#D07F2E; --K:#D45C9A; --DST:#AE8A38;
    --shadow:0 8px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#18212A; --surface2:#1F2A35; --ink:#E6ECF1; --muted:#93A3B2; --line:#27333F; --line2:#344251;
  --accent:#2FB8B4; --accent-ink:#0B1418; --accent-soft:#143a3a; --hot:#FF7A55; --hot-ink:#1A0E08; --hot-soft:#4a2419;
  --tough:#E0664B; --mid:#6F7D8A; --easy:#48BD7A;
  --good:#48BD7A; --warn:#E0A83A; --bad:#E0664B;
  --QB:#8F76DD; --RB:#3FA06A; --WR:#5A8ED8; --TE:#D07F2E; --K:#D45C9A; --DST:#AE8A38;
  --shadow:0 8px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.35;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:22px;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:17px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
a{color:var(--accent)}

/* ---- top bar ---- */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 14px;display:flex;align-items:center;gap:12px}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--line2);background:var(--surface2);flex:none}
.avatar.lg{width:56px;height:56px}
.avatar[hidden]{display:none}
.top .brand{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.06em;line-height:1;white-space:nowrap}
.top .brand small{display:block;font-family:var(--body);font-weight:600;font-size:10.5px;letter-spacing:.14em;color:var(--muted)}
.status{flex:1;min-width:0;display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;background:var(--surface2);white-space:nowrap;max-width:48vw;overflow:hidden;text-overflow:ellipsis}
.pill.hot{background:var(--hot);color:var(--hot-ink);animation:pulse 1.6s ease-in-out infinite}
.pill.accent{background:var(--accent);color:var(--accent-ink)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in oklab,var(--hot) 45%,transparent)}50%{box-shadow:0 0 0 7px transparent}}
@media (prefers-reduced-motion:reduce){.pill.hot{animation:none}}
.iconbtn{background:transparent;border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:13px;font-weight:600}
.iconbtn:hover{background:var(--surface2)}
@media (max-width:640px){.top{padding:6px 10px;gap:8px}.top .brand{font-size:17px}.top .brand small{font-size:9px;letter-spacing:.1em}.pill{padding:3px 8px;font-size:11.5px}.iconbtn{padding:3px 7px;font-size:12px}.status{gap:5px}}

/* ---- nav ---- */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;border:0;padding:9px 2px 7px;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}
.tabs button .b{display:inline-block;min-width:16px;padding:0 4px;border-radius:999px;background:var(--hot);color:var(--hot-ink);font-size:11px;margin-left:3px;vertical-align:top}

main{max-width:1180px;margin:0 auto;padding:12px 12px 24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card.hot{border-color:var(--hot);background:color-mix(in oklab,var(--hot) 8%,var(--surface))}
.card h2{margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.hot{background:var(--hot);color:var(--hot-ink);border-color:var(--hot)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=search],input[type=number],select{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;min-height:38px}
input[type=search]{width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pchip{--pc:var(--ink)}
.pchip[aria-pressed="true"]{background:var(--pc);border-color:var(--pc);color:#fff}
.pchip.ALL[aria-pressed="true"],.pchip.TGT[aria-pressed="true"],.pchip.FLEX[aria-pressed="true"]{color:var(--bg)}
.pchip.QB{--pc:var(--QB)}.pchip.RB{--pc:var(--RB)}.pchip.WR{--pc:var(--WR)}.pchip.TE{--pc:var(--TE)}.pchip.K{--pc:var(--K)}.pchip.DST{--pc:var(--DST)}

/* ---- position pills ---- */
.pos{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:40px;height:34px;border-radius:7px;color:#fff;font-family:var(--display);font-weight:700;font-size:15px;line-height:1;background:var(--pc)}
.pos small{font-size:10px;font-weight:600;opacity:.9;margin-top:2px}
.pos.QB{--pc:var(--QB)}.pos.RB{--pc:var(--RB)}.pos.WR{--pc:var(--WR)}.pos.TE{--pc:var(--TE)}.pos.K{--pc:var(--K)}.pos.DST{--pc:var(--DST)}
.tier{display:inline-block;font-family:var(--display);font-weight:600;font-size:12.5px;padding:1px 6px;border-radius:5px;border:1px solid var(--line2);color:var(--muted);letter-spacing:.04em}
.tier.t1,.tier.t2{color:var(--ink);border-color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:5px;vertical-align:middle}
.dot.inj{background:var(--warn)}
.dot.out{background:var(--bad)}

/* ---- board list ---- */
.board{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.brow.head{border-radius:10px 10px 0 0}
.brow:last-child{border-radius:0 0 10px 10px}
.brow{display:grid;grid-template-columns:44px minmax(0,1fr) 40px 48px 56px;gap:6px;align-items:center;padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}
.brow:last-child{border-bottom:0}
.brow.head{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface2);position:sticky;top:50px;z-index:5}
.brow .name{text-align:left;min-width:0}
.brow .name b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.brow .name span{font-size:12px;color:var(--muted)}
.brow .name .tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 5px;border-radius:4px;margin-left:6px;background:var(--accent-soft);color:var(--accent)}
.brow .name .tag.val{background:color-mix(in oklab,var(--good) 18%,transparent);color:var(--good)}
.brow .name .tag.reach{background:color-mix(in oklab,var(--warn) 18%,transparent);color:var(--warn)}
.brow .name .tag.run{background:var(--hot-soft);color:var(--hot)}
.brow .c{font-variant-numeric:tabular-nums}
.brow .c .sub{display:block;font-size:10.5px;color:var(--muted)}
.brow.taken{opacity:.42}
.brow.taken .name b{text-decoration:line-through}
.brow.mine{background:color-mix(in oklab,var(--accent) 10%,var(--surface))}
.brow.mine .name b{text-decoration:none}
.brow.clickable{cursor:pointer}
.brow.clickable:hover{background:var(--surface2)}
.brow .act .btn{padding:5px 8px}
.brow .col-d{display:none}
@media (min-width:720px){
  .brow{grid-template-columns:44px minmax(0,1fr) 40px 48px 56px 56px 56px 52px 56px 40px 62px;gap:8px;padding:7px 10px}
  .brow div.col-d{display:block} .brow span.col-d{display:inline} .brow .col-m{display:none}
}
.star{color:var(--warn);margin-right:3px}
.brow.avoid{opacity:.5}
.brow .act .btn{padding:4px 7px;font-size:12px}
.qhint{font-size:12.5px;color:var(--muted);margin:-2px 0 8px}
.qhint b{color:var(--ink)}
.simgrid{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:720px){.simgrid{grid-template-columns:repeat(3,1fr)}}
.simpick{background:var(--surface2);border-radius:8px;padding:8px 10px;font-size:13px}
.simpick b.h{display:block;font-family:var(--display);font-size:16px;font-weight:600;margin-bottom:2px}
.simpick div{display:flex;justify-content:space-between;gap:8px}
.kplist span{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:999px;padding:3px 6px 3px 10px;font-size:13px;margin:3px 6px 3px 0}
.kplist button{border:0;background:var(--line2);border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1}
.heat{display:inline-block;min-width:36px;padding:2px 5px;border-radius:5px;font-weight:600;font-size:12.5px;text-align:center;background:var(--hb);color:var(--ink)}
.avail{font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

.tag.ir{background:color-mix(in oklab,var(--tough) 16%,transparent);color:var(--tough)}
.tag.stash{background:color-mix(in oklab,var(--accent) 20%,transparent);color:var(--accent)}
.slot.ir{border-style:dashed}
.slot.ir .sl{color:var(--tough)}
/* ---- rec cards ---- */
.recs{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:720px){.recs{grid-template-columns:repeat(3,1fr)}}
.rec{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:6px;cursor:pointer;position:relative}
.rec:hover{border-color:var(--accent)}
.rec .rk{position:absolute;top:8px;right:10px;font-family:var(--display);font-weight:700;font-size:22px;color:var(--muted);opacity:.5}
.rec .nm{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.05}
.rec .why{font-size:12.5px;color:var(--muted);line-height:1.35}
.rec .stats{display:flex;gap:10px;font-size:12px;color:var(--muted)}
.rec .stats b{display:block;color:var(--ink);font-family:var(--display);font-size:17px;font-weight:600}
.rec .stats b .u{font-size:10px;color:var(--muted);margin-left:2px;font-family:var(--body);font-weight:600}

/* ---- sheet ---- */
.sheet-bg{position:fixed;inset:0;background:rgba(6,10,14,.55);z-index:40;display:none}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow);transform:translateY(100%);transition:transform .22s ease}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
@media (min-width:900px){.sheet{left:50%;right:auto;width:720px;transform:translate(-50%,100%)}.sheet.open{transform:translate(-50%,0)}}
.sheet .hdr{display:flex;gap:12px;align-items:flex-start}
.sheet .hdr h2{font-size:28px;text-transform:none;letter-spacing:0;line-height:1}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:12px 0}
.kv div{background:var(--surface2);border-radius:8px;padding:7px 9px}
.kv label{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kv b{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.1}
.kv small{color:var(--muted);font-size:11.5px}
.wk{display:grid;grid-template-columns:repeat(17,minmax(40px,1fr));gap:3px;margin:6px 0;overflow-x:auto;padding-bottom:4px}
.wk div{border-radius:4px;padding:4px 0;text-align:center;font-size:10.5px;font-weight:600;background:var(--hb);line-height:1.15}
.wk div span{display:block;font-size:9.5px;color:var(--muted);font-weight:600}
.wk div.bye{background:var(--surface2);color:var(--muted)}
.wk div.po{outline:2px solid var(--ink);outline-offset:-2px}

.injbox{border-left:3px solid var(--warn);background:color-mix(in oklab,var(--warn) 7%,var(--surface));border-radius:0 8px 8px 0;padding:8px 10px;margin:0 0 10px;font-size:13px}
.injbox.bad{border-color:var(--tough);background:color-mix(in oklab,var(--tough) 8%,var(--surface))}
.injbox.ok{border-color:var(--good);background:color-mix(in oklab,var(--good) 7%,var(--surface))}
.injbox b{display:block;font-family:var(--display);letter-spacing:.03em;margin-bottom:3px}
.injbox p{margin:3px 0;color:var(--muted)}
.injbox p.q{color:var(--ink);font-style:italic}
.injbox p.ok{color:var(--accent);font-style:normal}
.injbox .src{font-size:11px;color:var(--muted)}
/* ---- tables ---- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.sched td.h{text-align:center;padding:3px 2px;font-size:11px;font-weight:600;min-width:34px;background:var(--hb)}
.sched td.h span{display:block;font-size:9px;color:var(--muted)}
.sched td.bye{background:var(--surface2);color:var(--muted);text-align:center}
.sched th.w{text-align:center;min-width:34px}
.sched .team{font-weight:700;font-family:var(--display);font-size:15px;white-space:nowrap}
.legend{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:22px;height:10px;border-radius:3px}

/* ---- help ---- */
.help{max-width:760px;margin:0 auto}
.help h2{margin-top:4px}
.help h3{margin:14px 0 4px;color:var(--ink)}
.help p{margin:0 0 8px}
.help ol,.help ul{margin:0 0 8px;padding-left:22px}
.help li{margin-bottom:5px}
.help .step{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;margin-bottom:10px}
.help .step b.n{font-family:var(--display);font-size:22px;font-weight:700;color:var(--accent);line-height:1}
.help .col{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px}
.help .col b{font-family:var(--display);font-size:15px;letter-spacing:.03em}
.help .tip{border-left:3px solid var(--hot);padding:6px 10px;background:color-mix(in oklab,var(--hot) 8%,var(--surface));border-radius:0 8px 8px 0;margin:8px 0}
.help kbd{font:12px ui-monospace,Menlo,monospace;background:var(--surface2);padding:1px 5px;border-radius:4px;border:1px solid var(--line2)}
.help .toc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
/* ---- chat ---- */
.fab{position:fixed;right:14px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:30;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:10px 16px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;box-shadow:var(--shadow);cursor:pointer}
.fab[hidden]{display:none}
.chat{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:460px;background:var(--surface);border-left:1px solid var(--line);z-index:45;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease;box-shadow:var(--shadow)}
.chat.open{transform:none}
@media (prefers-reduced-motion:reduce){.chat{transition:none}}
.chat .ch{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.chat .ch h2{flex:1;font-size:18px}
.chat .msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:92%;padding:8px 11px;border-radius:12px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.bub.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bub.assistant{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:4px}
.bub.assistant.busy{color:var(--muted);font-style:italic}
.bub .ctx{display:block;font-size:11px;color:var(--muted);margin-top:4px;font-style:normal}
.chat .qp{display:flex;gap:6px;overflow-x:auto;padding:6px 12px;scrollbar-width:none;flex:none}
.chat .qp::-webkit-scrollbar{display:none}
.chat .in{display:flex;gap:6px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);align-items:flex-end}
.chat textarea{flex:1;min-height:42px;max-height:120px;resize:none;font:14px var(--body);padding:9px 10px;background:var(--surface);color:var(--ink);border:1px solid var(--line2);border-radius:8px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 9px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chat .intro{font-size:13px;color:var(--muted);padding:4px 2px}
.welcome{max-width:640px;margin:0 auto}
.welcome h2{margin:0 0 8px}
.teampick{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:16px}
.teampick button{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;padding:13px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);color:var(--ink);cursor:pointer;font:inherit;min-height:56px;justify-content:center}

.byes div span{display:block;font-size:9.5px;color:var(--muted)}

(function(){

const T = ()=>S.teams, R = ()=>S.rounds;
function teamAt(n){ const r=Math.ceil(n/T()), i=(n-1)%T(); return r%2===1 ? i+1 : T()-i; }

const drafted = new Map(); // pid -> {team, overall}

/* ---------------- stats helpers ---------------- */
function erf(x){ const s=x<0?-1:1; x=Math.abs(x); const t=1/(1+0.3275911*x); const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x); return s*y; }
function Phi(z){ return 0.5*(1+erf(z/Math.SQRT2)); }
function adp(p){ return p.yahooAdp ?? p.ffcAdp ?? p.sleeperAdp ?? p.ecr; }
function adpSrc(p){ return p.yahooAdp!=null?'Yahoo':p.ffcAdp!=null?'FFC':p.sleeperAdp!=null?'Sleeper':'ECR'; }
function sigma(p){ const a=adp(p); let s=p.ffcStd!=null?Math.max(1.5,p.ffcStd):Math.max(3,0.13*a);
  if(p.yahooAdp!=null&&p.ffcAdp!=null) s=Math.max(s,Math.abs(p.yahooAdp-p.ffcAdp)/2); return s; }

function pAvail(p,k){ if(drafted.has(p.id)) return 0; if(!k||k<=cur()) return 1; const now=survive(p,cur()); if(now<1e-6) return 0.02; return Math.min(1,survive(p,k)/now); }

/* VORP */
const REPL = {QB:14,RB:34,WR:34,TE:14,K:12,DST:12};   // starter baseline (VORP column)
const DEEP = {QB:22,RB:56,WR:64,TE:22,K:16,DST:16};   // waiver-wire baseline (draft value in recommendations)

function projOf(p){ if(p.proj==null) return null; const st=p.stats||{}, sc=S.scoring||{}; let v=p.proj+((sc.passTd??4)-4)*(st.pass_td||0)+((sc.ppr??0.5)-0.5)*(st.rec||0); if(p.pos==='TE') v+=(sc.tePrem||0)*(st.rec||0); return +v.toFixed(1); }
function computeRepl(){ const f=T()/12; POS.forEach(pos=>{ const arr=P.filter(p=>p.pos===pos&&p.proj!=null).map(projOf).sort((a,b)=>b-a); const idx=Math.min(arr.length-1,Math.round(REPL[pos]*f)-1); repl[pos]=arr[idx]||0; const j=Math.min(arr.length-1,Math.round(DEEP[pos]*f)-1); deep[pos]=arr[j]||0; }); }
function vorp(p){ const v=projOf(p); return v!=null ? +(v-repl[p.pos]).toFixed(1) : null; }
function dval(p){ const v=projOf(p); return v!=null ? Math.max(0,+(v-deep[p.pos]).toFixed(1)) : null; }

/* schedule / SOS */
const TEAMS = Object.keys(D.schedule);
function weeks(p){ const sc=D.schedule[p.team]; if(!sc) return null; return sc.slice(0,17).map((g,i)=>{ if(!g) return {w:i+1,bye:true}; const e=(D.ease[g.opp]||{})[p.pos]; return {w:i+1,opp:g.opp,home:g.home,ease:e==null?50:e}; }); }
function sos(p){ const w=weeks(p); if(!w) return null; const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const g=w.filter(x=>!x.bye); const po=S.playoff; return { season:avg(g.filter(x=>!po.includes(x.w)).map(x=>x.ease)), playoff:avg(g.filter(x=>po.includes(x.w)).map(x=>x.ease)), early:avg(g.filter(x=>x.w<=4).map(x=>x.ease)), weeks:w }; }
function easeStyle(e){ if(e==null) return ''; const pct=Math.round(Math.abs(e-50)*2); const hue=e<50?'var(--tough)':'var(--easy)'; return `--hb:color-mix(in oklab, color-mix(in oklab, ${hue} ${pct}%, var(--mid)) ${e<50?Math.max(22,pct*.55):Math.max(22,pct*.55)}%, var(--surface))`; }
function easeWord(e){ return e==null?'—':e>=70?'soft':e>=55?'lean+':e>=45?'even':e>=30?'lean−':'brutal'; }

/* need / recommendations */
function markOf(p){ return (S.marks||{})[p.id]||null; }

function irCode(p){ if(!p) return null; if(p.status==='Injured Reserve') return 'IR'; const i=p.injury||''; return (IR_STD[i]||IR_PLUS[i])?i:null; }

function irSlots(){ return S.roster.IR||0; }

function activePlayers(list){ const l=list||myPlayers(); const st=new Set(irStashed(l).map(p=>p.id)); return l.filter(p=>!st.has(p.id)); }
function openIR(list){ return Math.max(0, irSlots()-irStashed(list).length); }
const ETA={
  dtr:{s:'Back Wk5+',l:'On IR with a designation to return, so he can play this season. Under the standard rule he must miss the first 4 games, so Week 5 is the earliest.',t:'ok'},
  pup:{s:'Back Wk5+',l:'On the reserve/PUP list. Must miss the first 4 games, so Week 5 is the earliest he can play.',t:'ok'},

const FIREBASE_DB = "https://woodside-fantasy-draft-default-rtdb.firebaseio.com";   // set at build time when the app is hosted outside Claude
/* Firebase Realtime Database over plain REST + server-sent events: no SDK, no key, no sign-in. */
function fbDoc(path){
  const url = FIREBASE_DB.replace(/\/+$/,'') + '/' + path + '.json';

      return {exists:j!=null, data:()=>j==null?undefined:j}; },
    async set(data){ const r=await fetch(url, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});

      const refetch=()=>{ if(!stop) grab().then(emit).catch(()=>{}); };

        if(stop) return;
        try{ es=new EventSource(url); }catch(x){ es=null; live=false; return; }
        const onEv=e=>{ live=true; tries=0; try{ const d=JSON.parse(e.data); if(d && d.path==='/') emit(d.data); else refetch(); }catch(x){ refetch(); } };

}

function renderTabs(){ document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===S.tab)); }
function finishWelcome(slot,name){ const sl=Math.min(T(),Math.max(1,slot||1));

function ord(i){ const t=i%10, h=i%100; return i+((t===1&&h!==11)?'st':(t===2&&h!==12)?'nd':(t===3&&h!==13)?'rd':'th'); }
function renderWelcome(v){

function render(){ rebuildDrafted(); computeRepl(); renderStatus(); renderTabs(); const v=$('#view'); v.innerHTML='';

/* ---- BOARD ---- */
function filtered(){ let list=P.slice(); const q=S.q.trim().toLowerCase();
  if(q) list=list.filter(p=>p.name.toLowerCase().includes(q)||p.team.toLowerCase()===q);
  if(S.pos==='TGT') list=list.filter(p=>markOf(p)==='target'); else if(S.pos==='IR') list=list.filter(p=>irEligible(p)); else if(S.pos==='FLEX') list=list.filter(p=>['RB','WR','TE'].includes(p.pos)); else if(S.pos!=='ALL') list=list.filter(p=>p.pos===S.pos);
  if(S.hideDrafted&&!q) list=list.filter(p=>!drafted.has(p.id));
  const nk=nextMine(cur()+ (onClock()?1:0));
  const key={ecr:p=>p.ecr, adp:p=>adp(p), proj:p=>-(projOf(p)??-999), vorp:p=>-(dval(p)??-999), playoff:p=>-((sos(p)||{}).playoff??-1), season:p=>-((sos(p)||{}).season??-1), value:p=>-(adp(p)-p.ecr), avail:p=>-pAvail(p,nk)}[S.sort]||(p=>p.ecr);
  list.sort((a,b)=>key(a)-key(b)||a.ecr-b.ecr); return list; }
function quickTarget(){ if(!S.q.trim()) return null; return filtered().find(p=>!drafted.has(p.id))||null; }
function renderBoard(v){ const c=cur(); const nextK = onClock()? nextMineAfter(c) : nextMine(); const runs=runDetect(); const openIRnow=openIR(), lateRd=roundOf(c)>=R()-4; const qteam=onClock()?S.slot:teamAt(Math.min(c,total())); const qt=quickTarget();
  let html='';

    html+=`<section class="card ${onClock()?'hot':''}"><div class="row" style="justify-content:space-between"><h2>${onClock()?`You're on the clock — pick #${c}`:`If you were picking now`}</h2><span class="small muted">${nextK?`next pick #${nextK} · ${nextK-c} picks away`:'last pick'}${runs.length?` · <b style="color:var(--hot)">${runs.join('/')} run in progress</b>`:''} · <a href="#h-numbers" data-tab="help">what do these numbers mean?</a></span></div>
      <div class="recs">${rec.list.map((r,i)=>`<div class="rec" data-open="${r.p.id}"><span class="rk">${i+1}</span><div class="row" style="gap:8px">${posPill(r.p)}<div><div class="nm">${markOf(r.p)==='target'?'<span class="star">★</span>':''}${esc(r.p.name)}</div><div class="small muted">${r.p.team} · bye ${r.p.bye} · ECR ${r.p.ecr} · ${adpSrc(r.p)} ADP ${fmt(adp(r.p))} ${tierChip(r.p)}</div></div></div>
        <div class="stats"><span title="Season fantasy points above a waiver-wire player at his position">Value<b>${fmt(r.v,0)}<small class="u">pts</small></b></span><span title="Value of the best player at this position you would likely still get at your next pick">If you wait<b>${fmt(r.E,0)}<small class="u">pts</small></b></span><span title="Chance he is drafted before your next turn">Gone by #${nextK||'—'}<b>${nextK?Math.round((1-r.pa)*100)+'%':'—'}</b></span><span title="Roster-need multiplier">Need<b>×${r.need.toFixed(2)}</b></span></div>
        <div class="why">${esc(whyText(r))}</div></div>`).join('')}</div></section>`; }
  html+=`<div class="row" style="margin-bottom:8px"><input type="search" id="q" placeholder="Search player or team… (Enter logs the pick)" value="${esc(S.q)}" autocomplete="off" style="flex:1;min-width:160px">
    <select id="sort"><option value="ecr">Sort: ECR</option><option value="adp">Sort: ADP</option><option value="proj">Sort: Projected pts</option><option value="vorp">Sort: Value</option><option value="value">Sort: ADP − ECR (value)</option><option value="avail">Sort: Avail at my next</option><option value="playoff">Sort: Playoff schedule</option><option value="season">Sort: Season schedule</option></select>
    <button class="chip" id="hide" aria-pressed="${S.hideDrafted}">Hide taken</button></div>
    ${S.q.trim()&&!draftOver()?`<div class="qhint">${qt?`↵ Enter: <b>${esc(qt.name)}</b> → ${onClock()?'draft to '+esc(S.name):'taken by '+esc(teamName(qteam))}`:'no undrafted match'}</div>`:''}
    ${isFollower()?`<p class="small" style="margin:0 0 8px;color:var(--accent)"><b>Following the shared board.</b> ${esc(roomState.by||'The scorekeeper')} logs every pick; they appear here automatically. To log picks yourself, switch to “Log picks” in Setup.</p>`:''}
    <div class="chips" style="margin-bottom:8px">${['ALL','TGT','QB','RB','WR','TE','FLEX','K','DST'].concat(irSlots()?['IR']:[]).map(x=>{const tp={ALL:'Every position.',TGT:'Only the players you starred as targets.',FLEX:'Running backs, receivers and tight ends together — the players who can fill your flex slot.',IR:'Players on injured reserve or PUP who qualify for your IR slot. A late-round stash here costs a pick but no bench spot.',QB:'Quarterbacks only.',RB:'Running backs only.',WR:'Wide receivers only.',TE:'Tight ends only.',K:'Kickers only.',DST:'Team defences only.'}[x]; return `<button class="chip pchip ${x}" data-pos="${x}" aria-pressed="${S.pos===x}"${tip(tp)}>${x==='TGT'?'★ Targets':x==='IR'?'+ IR stash':x}</button>`;}).join('')}</div>`;
  const list=filtered().slice(0,S.q?60:200);
  html+=`<div class="board"><div class="brow head"><div${tip('Position, with his rank at that position. Colour-coded so you can scan for one position.')}>Pos</div><div class="name"${tip('Player name, team, bye week and age. Tap any row to open his full card.')}>Player</div><div class="col-d"${tip('Tier. Players inside one tier are close to interchangeable — the real drop-off is between tiers, so a tier with one player left is a warning.')}>Tier</div><div${tip('Expert consensus rank across '+D.meta.ecrExperts+' analysts. The small numbers under it are the lowest and highest rank any single expert gave him — a wide spread means the experts disagree, which is risk.')}>ECR</div><div class="col-d"${tip('Average draft position: the pick number where real drafters actually take him. Yahoo first, since that is your league. If ADP is well below his ECR, people reach for him; well above, he tends to fall to you.')}>ADP</div><div class="col-d"${tip('Projected total fantasy points for the season in your scoring. Divide by 17 for a per-game feel.')}>Proj</div><div class="col-d"${tip('Value: projected points ABOVE a freely available waiver-wire player at his position. This is the number to compare across positions. 200+ is a league-winner, 100 to 150 a solid starter, 0 is waiver level.')}>Value</div><div class="col-d"${tip('Playoff matchup score, 0 to 100, for weeks '+S.playoff.join(', ')+'. 50 is average, above 60 means soft opponents, below 40 means tough ones. A tiebreaker between similar players, never a reason to reach.')}>Playoff</div><div${tip('The chance he is still on the board at your next pick, based on where drafters take him and who is already gone. Over 70% means you can wait; under 35% means now or never.')}>@#${nextK||'—'}</div><div class="col-d"${tip('His bye week, when he scores nothing. Two starters sharing a bye is fine; three is a problem the Mine tab will flag.')}>Bye</div><div></div></div>`;
  if(!list.length) html+=`<div class="empty">${S.pos==='TGT'?'No targets yet. Open a player and tap ☆ Target.':'No players match.'}</div>`;
  for(const p of list){ const d=drafted.get(p.id); const mine=d&&d.team===S.slot; const s=sos(p); const pa=nextK?pAvail(p,nextK):null; const val=adp(p)-p.ecr; const mk=markOf(p);
    const tags=[]; if(!d&&val>=8&&p.ecr<=150) tags.push('<span class="tag val">value</span>'); if(!d&&val<=-8&&p.ecr<=150) tags.push('<span class="tag reach">market high</span>'); if(!d&&runs.includes(p.pos)) tags.push('<span class="tag run">run</span>'); if(!d&&irEligible(p)){ tags.push(`<span class="tag ir" title="${esc(injLine(p))}">${irCode(p)}${etaOf(p)?' · '+esc(etaOf(p).s):''}</span>`); if(openIRnow>0&&lateRd) tags.push('<span class="tag stash">free stash</span>'); } if(mk==='avoid') tags.push('<span class="tag reach">avoid</span>'); if(d) tags.push(`<span class="tag">${d.keeper?'KEEPER · ':''}${mine?'MINE':esc(teamName(d.team))}${d.keeper?'':' · #'+d.overall}</span>`);

      <div class="col-d">${tierChip(p)}</div><div class="c">${p.ecr}<span class="sub">${p.ecrMin}–${p.ecrMax}</span></div><div class="c col-d">${fmt(adp(p))}</div><div class="c col-d">${fmt(projOf(p),0)}</div><div class="c col-d">${fmt(dval(p),0)}</div>
      <div class="col-d">${s&&s.playoff!=null?`<span class="heat" style="${easeStyle(s.playoff)}">${Math.round(s.playoff)}</span>`:'—'}</div><div class="c avail">${pa==null?'—':pct(pa)}</div><div class="c col-d">${p.bye??'—'}</div>
      <div class="act">${!d&&!draftOver()&&canLog()?`<button class="btn sm ${onClock()?'hot':''}" data-draft="${p.id}" data-team="${qteam}" title="${onClock()?'Draft to '+esc(S.name):'Taken by '+esc(teamName(qteam))}">${onClock()?'Take':'Gone'}</button>`:''}</div></div>`; }
  html+=`</div><p class="small muted" style="margin-top:8px">Tap a row for the full card. <b>Gone</b> logs the player to the team on the clock; when you're up it becomes <b>Take</b>. ECR = FantasyPros expert consensus (half-PPR) with expert min–max. @# = chance the player is still there at your next pick, given who is already gone. ★ = your targets.</p>`;
  v.innerHTML=html;
  const q=$('#q'); q.oninput=()=>{ S.q=q.value; const keep=q.selectionStart; render(); const q2=$('#q'); q2.focus(); q2.setSelectionRange(keep,keep); };
  q.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); const t=quickTarget(); if(!t){ toast('No undrafted player matches'); return; } S.q=''; draftPlayer(t.id,qteam); const q2=$('#q'); if(q2) q2.focus(); } };
  $('#sort').value=S.sort; $('#sort').onchange=e=>{S.sort=e.target.value;render();};
  $('#hide').onclick=()=>{S.hideDrafted=!S.hideDrafted;render();};

function openSheet(pid){ sheetPid=pid; const p=byId.get(pid); const d=drafted.get(pid); const s=sos(p); const c=cur(); const nextK=onClock()?nextMineAfter(c):nextMine(); const following=nextK?nextMineAfter(nextK):null;

    ${d?`<div class="pill accent" style="margin-top:6px">${d.keeper?'Keeper of':'Drafted #'+d.overall+' by'} ${esc(teamName(d.team))}</div>`:''}</div><button class="iconbtn" id="closeSheet" aria-label="Close">✕</button></div>
  <div class="kv">

    <div${tip('Average draft position from FantasyFootballCalculator mock drafts, with the earliest and latest he actually went. A second opinion on the market.')}><label>FFC ADP</label><b>${fmt(p.ffcAdp)}</b><small>${p.ffcHigh?`range ${p.ffcHigh}–${p.ffcLow}`:''}</small></div>
    <div${tip('Average draft position on Sleeper, half-PPR. A third read on where the market has him.')}><label>Sleeper ADP</label><b>${fmt(p.sleeperAdp)}</b><small>half-PPR</small></div>
    <div${tip('Projected fantasy points for the whole season in your scoring, and the games that projection assumes he plays. Divide by 17 for a per-game number.')}><label>Projected</label><b>${fmt(projOf(p),0)}</b><small>pts · ${fmt(st.gp,0)} gms${projOf(p)!==p.proj?' · adj':''}</small></div>
    <div${tip('Points above a freely available waiver-wire player at his position. The one number that compares fairly across positions, because backup quarterbacks score far more than backup running backs.')}><label>Value</label><b>${fmt(dval(p),0)}</b><small>pts over waiver ${p.pos}${Math.round(DEEP[p.pos]*T()/12)}</small></div>

function draftPlayer(pid,team){ if(drafted.has(pid)) return; if(roomOn()&&roomState.s==='live'&&!isBoardOwner()){ toast('Only '+(roomState.by||'the scorekeeper')+' enters picks on this board.'); return; } if(!canLog()){ toast('Following the shared board — switch to “Log picks” in Setup to enter picks.'); return; } if(draftOver()){ toast('Draft is complete'); return; }

/* ---- MY TEAM ---- */
function slotOrder(){ const r=S.roster, o=[]; ['QB','RB','WR','TE','FLEX','K','DST','BN','IR'].forEach(k=>{ for(let i=0;i<(r[k]||0);i++) o.push(k); }); return o; }
function assignRoster(players){ const slots=slotOrder().map(k=>({k,p:null})); const sorted=players.slice().sort((a,b)=>(vorp(b)??-99)-(vorp(a)??-99));
  const irs=new Set(irStashed(players).map(p=>p.id));
  for(const p of sorted){ if(irs.has(p.id)){ const ir=slots.find(x=>!x.p&&x.k==='IR'); if(ir){ ir.p=p; continue; } }
    let s=slots.find(x=>!x.p&&x.k===p.pos); if(!s&&['RB','WR','TE'].includes(p.pos)) s=slots.find(x=>!x.p&&x.k==='FLEX'); if(!s) s=slots.find(x=>!x.p&&x.k==='BN'); if(s) s.p=p; else slots.push({k:'BN',p}); } return slots; }
const SLOTTIP={QB:'Starting quarterback.',RB:'Starting running back.',WR:'Starting wide receiver.',TE:'Starting tight end.',FLEX:'Flex: one extra starter who can be a running back, receiver or tight end.',K:'Kicker.',DST:'Team defence and special teams.',BN:'Bench: not in your lineup, there for byes, injuries and upside.',IR:'Injured reserve: holds a player on IR or PUP without using a bench spot. Move him here in Yahoo after the draft.'};
function slotHtml(s){ return `<div class="slot ${s.k==='IR'?'ir ':''}${s.p?'filled':''}" ${s.p?`data-open="${s.p.id}"`:''}><span class="sl"${tip(SLOTTIP[s.k]||s.k)}>${s.k}</span>${s.p?`<div class="pn"><b>${esc(s.p.name)}${injDot(s.p)}</b><span>${s.p.pos}${s.p.posRank} · ${s.p.team} · bye ${s.p.bye} · proj ${fmt(projOf(s.p),0)}</span></div><div>${sos(s.p)&&sos(s.p).playoff!=null?`<span class="heat" style="${easeStyle(sos(s.p).playoff)}" title="playoff softness">${Math.round(sos(s.p).playoff)}</span>`:''}</div>`:`<div class="pn muted">open</div><div></div>`}</div>`; }
function renderTeam(v){ const mine=myPlayers(); const slots=assignRoster(mine); const starters=slots.filter(s=>s.k!=='BN'&&s.k!=='IR'&&s.p).map(s=>s.p); const stash=slots.filter(s=>s.k==='IR'&&s.p).map(s=>s.p);

  const byes={}; starters.forEach(p=>{ if(p.bye) byes[p.bye]=(byes[p.bye]||[]).concat(p.name); });
  const po=starters.filter(p=>sos(p)).map(p=>sos(p).playoff).filter(x=>x!=null); const poAvg=po.length?po.reduce((a,b)=>a+b,0)/po.length:null;
  const c=myCounts(); const need=POS.filter(k=>k!=='K'&&k!=='DST').map(k=>`${k} ${c[k]}/${S.roster[k]}`).join(' · ');
  let html=`<section class="card"><div class="row" style="justify-content:space-between"><div class="row" style="gap:10px">${avatarSrc()?`<img class="avatar lg" src="${avatarSrc()}" alt="">`:''}<h2>${esc(S.name)} — ${mine.length} of ${R()} picks</h2></div><span class="small muted">${need}</span></div>
    <div class="kv"><div${tip('Total projected points from your starting lineup only, over the full season. Bench players are not counted.')}><label>Starter proj</label><b>${fmt(tot,0)}</b><small>pts / season</small></div><div${tip('Average matchup softness of your starters during your fantasy playoff weeks ('+S.playoff.join(', ')+'), on a 0 to 100 scale where 50 is average.')}><label>Playoff slate</label><b>${poAvg==null?'—':Math.round(poAvg)}</b><small>${easeWord(poAvg)}</small></div><div${tip('How many of your '+R()+' picks you have used, and which overall pick number is yours next.')}><label>Picks used</label><b>${mine.length}</b><small>next #${nextMine()||'—'}</small></div><div${tip('Weeks where two or more of your starters are on bye at the same time. Two is manageable, three or more means you will be starting waiver-wire players that week.')}><label>Bye clashes</label><b>${Object.values(byes).filter(a=>a.length>=2).length}</b><small>weeks w/ 2+ starters</small></div></div>
    <div class="slotwrap"><div><h3 style="margin-bottom:6px">Starters</h3><div class="slots">${slots.filter(s=>s.k!=='BN'&&s.k!=='IR').map(slotHtml).join('')}</div></div><div><h3 style="margin-bottom:6px">Bench</h3><div class="slots">${slots.filter(s=>s.k==='BN').map(slotHtml).join('')}</div>${irSlots()?`<h3 style="margin:10px 0 6px">Injured reserve</h3><div class="slots">${slots.filter(s=>s.k==='IR').map(slotHtml).join('')}</div>`:''}</div></div>

  html+=`<section class="card"><h2>Bye weeks (starters)</h2><div class="byes">${Array.from({length:18},(_,i)=>i+1).map(w=>{const n=(byes[w]||[]).length; const who=(byes[w]||[]).join(', '); return `<div class="${n>=3?'w3':n>=2?'w2':''}"${tip('Week '+w+': '+(n?n+' of your starters on bye — '+who:'no starters on bye'))}>${n||''}<span>w${w}</span></div>`;}).join('')}</div>

  if(starters.length){ html+=`<section class="card"><h2>Starters — playoff matchups</h2><div class="scroll"><table class="tbl"><tr><th>Player</th>${S.playoff.map(w=>`<th class="w">W${w}</th>`).join('')}<th class="r">Avg</th></tr>`;
    starters.forEach(p=>{ const s=sos(p); if(!s) return; html+=`<tr><td><b>${esc(p.name)}</b> <span class="muted small">${p.pos}</span></td>${S.playoff.map(w=>{const x=s.weeks[w-1]; return x&&!x.bye?`<td class="h" style="${easeStyle(x.ease)}">${x.home?'':'@'}${x.opp}<span>${Math.round(x.ease)}</span></td>`:`<td class="bye">BYE</td>`;}).join('')}<td class="r"><span class="heat" style="${easeStyle(s.playoff)}">${s.playoff==null?'—':Math.round(s.playoff)}</span></td></tr>`; });

/* ---- PICKS ---- */
function leagueGrades(){ return Array.from({length:T()},(_,i)=>i+1).map(t=>{ const pl=teamPlayers(t); const slots=assignRoster(pl); const st=slots.filter(s=>s.k!=='BN'&&s.p).map(s=>s.p); const bn=slots.filter(s=>s.k==='BN'&&s.p).map(s=>s.p);
  const sp=st.reduce((a,p)=>a+(projOf(p)||0),0), bp=bn.reduce((a,p)=>a+(projOf(p)||0),0); const byes={}; st.forEach(p=>{byes[p.bye]=(byes[p.bye]||0)+1;}); const clash=Object.values(byes).filter(n=>n>=2).length;
  const po=st.map(p=>sos(p)).filter(s=>s&&s.playoff!=null).map(s=>s.playoff); const poAvg=po.length?po.reduce((a,b)=>a+b,0)/po.length:null;
  let steal=null; S.picks.forEach((pk,i)=>{ if(pk.team!==t) return; const p=byId.get(pk.pid); const dlt=adp(p)-(i+1); if(!steal||dlt>steal.d) steal={p,d:dlt}; });
  return {t,n:pl.length,sp,bp,clash,poAvg,steal}; }).sort((a,b)=>b.sp-a.sp); }

  html+=`<div class="rounds">`;
  for(let r=1;r<=R();r++){ html+=`<div class="round"><h3>Round ${r}</h3>`; for(let i=0;i<T();i++){ const n=(r-1)*T()+i+1; const t=teamAt(n); const pk=S.picks[n-1]; const p=pk?byId.get(pk.pid):null;

    ${rows.map(r=>`<tr><td class="team">${r.t}</td><td class="r"><span class="heat" style="${easeStyle(r.season)}">${Math.round(r.season)}</span></td><td class="r"><span class="heat" style="${easeStyle(r.playoff)}">${r.playoff==null?'—':Math.round(r.playoff)}</span></td>${r.w.map(x=>x.bye?`<td class="bye" title="Bye week — no game, ${r.t} players score nothing">—</td>`:`<td class="h" style="${easeStyle(x.ease)}${S.playoff.includes(x.w)?';outline:2px solid var(--ink);outline-offset:-2px':''}">${x.home?'':'@'}${x.opp}<span>${Math.round(x.ease)}</span></td>`).join('')}</tr>`).join('')}</table></div>

  <div class="toc">${[['#h-numbers','The numbers, decoded'],['#h-ir','The IR slot'],['#h-share','Sharing & the live board'],['#h-before','Before the draft'],['#h-during','During the draft'],['#h-board','Reading the board'],['#h-recs','How picks are chosen'],['#h-targets','Targets & avoid'],['#h-sim','Mock simulator'],['#h-chat','War-room chat'],['#h-intel','Intel tab'],['#h-mine','Mine tab'],['#h-picks','Picks & grades'],['#h-sched','Schedules'],['#h-setup','Setup: scoring & keepers'],['#h-data','Data & caveats']].map(([a,t])=>`<a class="chip" href="${a}">${t}</a>`).join('')}</div></section>

  ${(()=>{ if(draftOver()) return ''; const rec=recommendations(2); const r=rec.list[0], r2=rec.list[1]; if(!r) return ''; const p=r.p; const nk=rec.nextK; const s=sos(p); const gone=nk?Math.round((1-r.pa)*100):null; const cost=Math.max(0,r.v-r.E); const pw=x=>(x/17).toFixed(1);
    return `<section class="card" id="h-numbers"><h2>The numbers, decoded</h2>
  <p>Everything on the cards and the board is in one unit: <b>fantasy points over a full season</b> under your scoring. To turn any of them into a weekly feel, divide by 17. A 234 means about ${pw(234)} points per game more than the comparison. Here is the app's current #1 card, read line by line.</p>
  <div class="tip" style="border-color:var(--accent);background:color-mix(in oklab,var(--accent) 8%,var(--surface))"><b>${esc(p.name)}</b> (${p.pos}${p.posRank}, ${p.team}) · Value <b>${fmt(r.v,0)}</b> · If you wait <b>${fmt(r.E,0)}</b> · Gone by #${nk||'—'} <b>${gone==null?'—':gone+'%'}</b> · Need <b>×${r.need.toFixed(2)}</b></div>
  <div class="col">
  <b>Value ${fmt(r.v,0)}</b><span>Over the season, ${esc(p.name.split(' ').slice(-1)[0])} is projected to score <b>${fmt(r.v,0)} more points than a ${p.pos} you could grab free off waivers</b> (about ${pw(r.v)} a game). It's "how much better than nothing is he." Rough scale: 200+ is a league-winner, 100–150 a solid starter, 40 a useful bench piece, 0 is waiver level.</span>
  <b>If you wait ${fmt(r.E,0)}</b><span>Skip ${p.pos} now and come back to it at your next pick, #${nk||'—'}: the best ${p.pos} you'd <i>probably</i> still get is worth about <b>${fmt(r.E,0)}</b>. The app works that out from every remaining ${p.pos}'s odds of surviving the picks in between. <b>Value minus this is the cost of waiting: ${fmt(r.v,0)} − ${fmt(r.E,0)} = ${fmt(cost,0)} points</b> (${pw(cost)} a game) you give up by taking a different position first. Big gap = take him now. Tiny gap = the position is deep, you can wait.</span>
  <b>Gone by #${nk||'—'}: ${gone==null?'—':gone+'%'}</b><span>The chance somebody else drafts <i>him specifically</i> before your next turn, based on where real Yahoo drafters take him and who is already gone. Over 70%: it's now or never. Under 35%: you can probably get him later.</span>
  <b>Need ×${r.need.toFixed(2)}</b><span>A multiplier from your roster, not points. Players parked on IR don't count toward it. ×1.15 means you still have an open starting slot at ${p.pos}. ×1.0 is neutral. Below 1 means you're already covered there (a second QB, a fourth RB), so he has to be a lot better to be worth it. ×0 means never (a second kicker).</span>
  <b>Why he's #1</b><span>Cards are ranked by <b>Need × (½ Value + ½ cost of waiting)</b>. In words: how good is he, how much do you lose by not taking him now, and do you need him. ${r2?`Card 2 right now is ${esc(r2.p.name)} at Value ${fmt(r2.v,0)} / wait ${fmt(r2.E,0)} — the gap between the cards is the real information: a big gap means don't overthink it, a small gap means look at "Gone by" and take the one who won't be there.`:''}</span>
  <b>The reasons line</b><span>"Tier 1 RB: 3 of 5 left" = how many players in his tier are still available (when it says 1, the drop-off is next). "89% gone by #21" = same as above. "Waiting costs ~33 pts" = the Value-minus-wait gap. "Soft/tough playoff slate" = weeks ${S.playoff.join('–')} matchups. "Bye 6 stacks with 2 of yours" = you'd have three starters off that week.</span>
  </div>
  <h3 style="margin-top:14px">The board columns, same player</h3>
  <div class="col">
  <b>T${p.tier??'-'}</b><span>FantasyPros tier. Players in a tier are near-interchangeable; the cliff is between tiers.</span>
  <b>ECR ${p.ecr} <span class="muted">${p.ecrMin}–${p.ecrMax}</span></b><span>Consensus rank across ${D.meta.ecrExperts} experts; the small numbers are the lowest and highest any expert ranked him. A wide spread (${p.ecrMin}–${p.ecrMax} is ${p.ecrMax-p.ecrMin<=6?'tight':p.ecrMax-p.ecrMin<=15?'moderate':'wide'}) means the experts disagree, which is risk.</span>
  <b>ADP ${fmt(adp(p))}</b><span>Average pick number where real ${adpSrc(p)} drafters take him. If ADP is much higher than ECR (say ADP 40, ECR 28) he tends to <i>fall</i>, and the board tags him "value". If ADP is much lower than ECR, drafters reach for him: "market high".</span>
  <b>Proj ${fmt(projOf(p),0)}</b><span>Total projected fantasy points this season in your scoring, about ${pw(projOf(p)||0)} per game. Raw production, before comparing to anyone.</span>
  <b>Value ${fmt(dval(p),0)}</b><span>Proj minus the waiver-level ${p.pos} (${p.pos}${Math.round(DEEP[p.pos]*T()/12)} in a ${T()}-team league). The same Value as on the card. This is the number to compare across positions: a 300-point QB and a 250-point RB can have the same Value because backup QBs score a lot more than backup RBs.</span>
  <b>Playoff ${s&&s.playoff!=null?Math.round(s.playoff):'—'}</b><span>Matchup softness for weeks ${S.playoff.join('–')}, 0–100. 50 is average, green above 60 means his playoff opponents give up lots of points to ${p.pos}s, red below 40 means tough defenses. A tiebreaker, not a reason to reach.</span>
  <b>@#${nk||'—'} ${nk?pct(pAvail(p,nk)):'—'}</b><span>Chance he is still on the board at your next pick. This is 100% minus "Gone by". Sort the board by this to find players you can safely wait on.</span>
  <b>Bye ${p.bye??'—'}</b><span>His week off. Two starters sharing a bye is fine; three is a problem the Mine tab will flag.</span>
  </div>
  <div class="tip">On the clock, you don't need any of this. Read the name on card one, tap Take. Look at the numbers only when cards one and two are close, or between your picks when you have time.</div></section>`; })()}

  <section class="card" id="h-before"><h2>Before the draft</h2>
  <div class="step"><b class="n">1</b><div><b>Setup tab → team names.</b> Type the other ${T()-1} teams in <i>draft order</i> (slot 1 picks first). Slot ${S.slot} is you. This makes the log, the "Gone" buttons and the league grades read correctly.</div></div>
  <div class="step"><b class="n">2</b><div><b>Confirm scoring, roster and playoff weeks.</b> Defaults are stock Yahoo. If the commissioner changes pass-TD points or reception points, set them in Setup and every projection re-scores itself.</div></div>
  <div class="step"><b class="n">3</b><div><b>Enter keepers</b> (Setup → Keepers) if your league has them, so they're off the board before pick 1.</div></div>
  <div class="step"><b class="n">4</b><div><b>Star your targets, X your avoids.</b> Open any player and tap ☆ Target or ✕ Avoid. Targets get a ★ on the board, a boost in the recommendations, and their own watch list on Intel. Avoids are dimmed and nearly never recommended.</div></div>
  <div class="step"><b class="n">5</b><div><b>Run the mock simulator</b> (Intel tab) a few times, forcing different first-round choices, to see what your roster tends to look like from slot ${S.slot}.</div></div>
  <div class="step"><b class="n">6</b><div><b>Open it on the device you'll draft with.</b> State is saved in that browser. To move it, copy the Backup box from Setup into the other device.</div></div>
  ${board1.length?`<div class="tip"><b>Right now, likely on the board at #${nk}:</b> ${board1.map(([p,pa])=>`${esc(p.name)} (${Math.round(pa*100)}%)`).join(', ')}.</div>`:''}</section>

  <section class="card" id="h-during"><h2>During the draft</h2>
  <div class="step"><b class="n">1</b><div><b>Someone else picks →</b> three ways, fastest first: <b>(a)</b> type a few letters in search and press <kbd>Enter</kbd> — the hint under the box shows exactly who will be logged and to which team; <b>(b)</b> tap the <b>Gone</b> button on the row; <b>(c)</b> tap the row and use the "Taken by" button on the card. The app always knows whose turn it is, so all three log to the team on the clock. If a pick was entered out of order, use the "Taken by other team…" menu on the card.</div></div>
  <div class="step"><b class="n">2</b><div><b>You're on the clock →</b> the header pulses <span class="pill hot" style="animation:none">YOU'RE UP</span>, the row buttons turn into <b>Take</b>, and the top three cards show the recommendation with reasons. <kbd>Enter</kbd> in search drafts the match to you. You are never limited to the three cards — any row's Take button works.</div></div>
  <div class="step"><b class="n">3</b><div><b>Made a mistake →</b> <b>↶ Undo</b> in the header removes the last pick. For an earlier pick, open that player and tap "Remove this pick" (later picks shift up one slot, so re-check the log).</div></div>
  <div class="step"><b class="n">4</b><div><b>Between your picks →</b> glance at <b>Intel</b>: your targets' survival odds, who is likely gone before you, which teams pick before you and what they need, whether a run has started. Re-run the simulator if the board has gone weird.</div></div>
  <div class="tip">Keyboard: <kbd>/</kbd> focuses search, <kbd>Enter</kbd> logs the first undrafted match, <kbd>Esc</kbd> closes a card. Typing a team code like <kbd>det</kbd> lists that team. "Hide taken" is on by default; turn it off to see where players went. The ★ Targets chip filters the board to your list.</div></section>

  <section class="card" id="h-board"><h2>Reading the board</h2>
  <div class="col">
  <b>ECR</b><span>FantasyPros expert consensus rank (half-PPR). The small range under it is the lowest and highest rank any expert gave — a wide range means the experts disagree, i.e. risk.</span>
  <b>Tier</b><span>FantasyPros tier. Players in the same tier are roughly interchangeable; the drop between tiers is what matters. On a phone the tier shows in the grey line under the name.</span>
  <b>ADP</b><span>Average draft position — where real drafters take him. Yahoo ADP when available (your league's site), else FantasyFootballCalculator, else Sleeper. The player card shows all three.</span>
  <b>Proj</b><span>Projected season fantasy points (Sleeper/Rotowire), re-scored to your Setup scoring. "adj" on the card means your scoring changed it.</span>
  <b>Value</b><span>Projected points minus a waiver-wire player at the same position (see the decoder above). The one number that compares players across positions.</span>
  <b>Playoff</b><span>Matchup softness for your playoff weeks, 0–100. Green/high = his opponents give up a lot of points to his position. Red/low = tough defenses.</span>
  <b>@#N</b><span>Chance he is still available at your next pick, given who is already gone. 100% = safe to wait; 10% = now or never.</span>
  <b>Gone / Take</b><span>One-tap logging. Gone = taken by the team on the clock; Take = drafted to you.</span>
  </div>
  <p style="margin-top:8px"><b>Tags:</b> <span style="display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 5px;border-radius:4px;background:color-mix(in oklab,var(--good) 18%,transparent);color:var(--good)">value</span> = experts rank him at least 8 spots higher than the market drafts him (he tends to fall). <span style="display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 5px;border-radius:4px;background:color-mix(in oklab,var(--warn) 18%,transparent);color:var(--warn)">market high</span> = drafters take him 8+ spots before the experts would (don't reach). <span style="display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 5px;border-radius:4px;background:var(--hot-soft);color:var(--hot)">run</span> = his position has gone 4+ times in the last 6 picks. <span class="star">★</span> = your target; dimmed rows are your avoids. A yellow dot is an injury tag; red is Out/Doubtful/IR.</p></section>

  <section class="card" id="h-recs"><h2>How the three recommendations are chosen</h2>
  <p>"Best available" by rank is the lazy answer, and it's wrong a lot: it ignores what you already have, and it ignores what will still be there when you pick again. Each card shows four numbers and the score combines them.</p>
  <div class="col">
  <b>Value</b><span>Projected points above a <i>waiver-wire</i> baseline (QB22 / RB56 / WR64 / TE22 in a 12-team league). The same Value shown on the board.</span>
  <b>If you wait</b><span>The expected VORP of the best player <i>at that same position</i> who will still be on the board at your next pick. Computed from every remaining player's survival odds, not just one guy. Big number = the position is deep, you can wait. Small number = it's about to dry up.</span>
  <b>Gone by #N</b><span>Probability this specific player is drafted before you pick again.</span>
  <b>Need</b><span>Multiplier from your roster. ×1.15 while a starting slot is open, rising to ×1.6 from round 6 so you never finish with a hole; ×1.0 once starters are full but the flex is open; ×0.85 for pure bench, nudged down when you're already lopsided RB-vs-WR; a backup QB or TE is ×0.35–0.5 and a third is ×0.05; a 7th RB or WR is ×0.15. Kickers and defenses are ×0.03 until three rounds from the end, ×0.6 then, and ×2.5 in the final two rounds — so the app never suggests a kicker in round 8, and never lets you forget one in round 15. Once you own a K or DEF, more are ×0.</span>
  </div>
  <p style="margin-top:8px"><b>Score = Need × (½ Value + ½ [Value − If-you-wait]).</b> The second half is the cost of waiting: how much you lose by taking someone else now and coming back to this position later. Then the adjustments: <b>★ target ×1.25</b>, <b>✕ avoid ×0.3</b>, the <b>backup to an RB you own ×1.1</b> from round 7 on, a <b>receiver on your QB's team ×1.05</b>, Out/IR ×0.4, Doubtful ×0.7.</p>
  <p>The reasons line under each card lists: target/avoid status, how many players are left in his tier, his gone-by chance, the cost of waiting, handcuff or stack notes, a soft/tough playoff slate, an injury note, and whether his bye already stacks with two of your starters.</p>
  <div class="tip">How to read it in the room: if card 1 and card 2 are close, take the one with the higher "Gone by" number and plan to grab the other at your next pick. If a player you love is not in the top three, open his card — the "At #N" numbers tell you whether you can wait.</div></section>

  <section class="card" id="h-targets"><h2>Targets and avoid list</h2>
  <p>Open any player card and tap <b>☆ Target</b> or <b>✕ Avoid</b> (tap again to clear). This is how you fold in your own reads and the morning's news without touching the data.</p>
  <ul><li><b>Targets</b> get a ★ on the board, the ★ Targets filter chip, a ×1.25 boost in recommendations, and a <b>Targets watch</b> table at the top of Intel showing each one's odds of reaching your next two picks. When a target drops under 50% it's flagged <i>now or never</i>.</li>
  <li><b>Avoids</b> are dimmed on the board, tagged, and cut to ×0.3 in the recommendations — they'll only surface if nothing else is left.</li>
  <li>Both survive "Clear draft", so you can set them up days ahead.</li></ul></section>

  <section class="card" id="h-sim"><h2>Mock-draft simulator</h2>
  <p>On Intel. Plays the rest of the draft out 200 times from the current board and reports what happened.</p>
  <ul><li><b>Other teams</b> pick by ADP with realistic randomness (each player's real pick spread), fill roster needs, don't take a second QB or TE before round 10, and grab K/DEF only in the last rounds.</li>
  <li><b>Your picks</b> follow the app's value-and-need logic, respect your targets and avoids — or you can <b>force one player at your next pick</b> from the dropdown to compare paths ("what if I go WR at #4?").</li>
  <li><b>Output:</b> average starter projection for your finished roster (with the 80% range), the players you most often end up with at each of your next six picks, and a <b>simulated vs model</b> table of who survives to your next pick. When the two disagree, the simulation is accounting for roster needs the simple model can't see.</li></ul>
  <p class="small muted">It's a model of average drafters, not your buddies. If your league loves QBs early, mentally shift QB odds down.</p></section>

  <section class="card" id="h-chat"><h2>War-room chat (the ASK button)</h2>
  <p>The round <b>ASK</b> button opens a chat with Claude that <i>sees the live board</i>. Every question is sent with the current state: your roster and needs, the pick on the clock and your next two picks, the top available with every number on the board, the app's own top-5 recommendations with their reasons, tier counts, runs, the teams picking before you, your targets, and the last mock result. Ask it to argue against the #1 card, compare two players, find your biggest hole, or sanity-check a reach.</p>
  <ul><li><b>Fast vs Deep.</b> Fast answers in a second or two and is what you want with a clock running. Deep thinks first (10–60 seconds) and is for prep questions.</li>
  <li><b>It can use the app.</b> Claude can pull any player's full card and weekly matchups, list deeper at a position, run 100 mock drafts (they show up on Intel too), and star or avoid a player if you tell it to. It never makes a pick; you tap the button.</li>
  <li><b>It's briefed.</b> Every question carries a standing briefing: the mission from slot ${S.slot} (the long wait between your first two picks, the near back-to-back after), how every number on the board is computed and what its limits are, the drafting principles the app follows, and how to answer (verdict first, disagree with the #1 card when the numbers say so, end with "Take" or "Wait"). It knows what the app knows and nothing after the data snapshot; if you've heard news, say it in the question.</li>
  <li><b>Your game plan.</b> Setup has a "Game plan for the war-room chat" box (also the <b>Plan</b> button in the chat header). Whatever you write there — players you love or hate, how your league drafts, the strategy you want to run — goes in as standing orders with every question, and Claude says so when it deviates from them.</li>
  <li><b>Cost and consent.</b> It runs on your own Claude account; the first question asks permission. Stop cancels a long answer. Clear wipes the conversation (it's kept only for this browser session).</li>
  <li>If the button isn't there, this view can't reach Claude (for example the file opened outside claude.ai).</li></ul></section>

  <section class="card" id="h-intel"><h2>Intel tab</h2>
  <ul><li><b>Targets watch:</b> your starred players and their survival odds.</li>
  <li><b>Mock-draft simulator:</b> see above.</li>
  <li><b>Before your pick #N:</b> the teams that pick in the gap and their current position counts. Teams with an empty RB or WR slot in the early rounds almost always fill it.</li>
  <li><b>Who survives:</b> the top 36 available split into probably gone / coin flip / likely there. The coin-flip group is where your real decision lives.</li>
  <li><b>Projected board at your pick after next:</b> players with a 50%+ chance to reach that pick. If your target is listed, you have room to take something else first.</li>
  <li><b>Tier board:</b> remaining count in each tier by position. "T2 1/6 left" means one more pick empties the tier.</li>
  <li><b>Positional drop-off:</b> VORP of the best, 6th, and 12th available at each position. A steep curve means scarcity.</li>
  <li><b>Momentum:</b> run detection over the last six picks.</li>
  <li><b>Softest playoff schedules:</b> the late-round tiebreaker list.</li></ul></section>

  <section class="card" id="h-ir"><h2>The IR slot</h2>
  <p>${irSlots()?`Your league added an injured-reserve spot, and the app now uses it. Roster setting: <b>${irSlots()} IR</b>${S.irPlus?' (IR+, also accepts Out/suspended)':''}. It changes one real decision.`:`Your roster is currently set to <b>0 IR</b> slots, so none of this is active. Set IR on the Setup tab if your league has one.`}</p>
  <ul>
  <li><b>It does not add a draft round.</b> You still make ${R()} picks. Yahoo doesn't draft into IR spots — you draft an injured player into your bench, then move him to IR once the draft ends, which gives the bench spot back.</li>
  <li><b>So a stash is nearly free.</b> In the last two or three rounds, the choice isn't "injured guy vs. good guy," it's "injured guy who might return in October vs. the 14th-best bench body I'll drop in week 2." The app reflects that: an IR-eligible player gets a <b>1.2× boost</b> in the last three rounds while you have an open IR slot, but is still marked down early (0.5×) — never burn a real pick on one — and cut to 0.3× once your IR slot is full, because then he does cost a bench spot.</li>
  <li><b>Who qualifies.</b> The board tags anyone listed <span class="tag ir">IR</span> <span class="tag ir">PUP</span> <span class="tag ir">NFI</span> <span class="tag ir">NA</span> <span class="tag ir">DNR</span>. Players merely listed Out or Questionable do <i>not</i> qualify for a standard Yahoo IR slot; tick <b>IR+</b> in Setup if your league accepts them. Verify against your league settings on Friday, since Yahoo has a few variants.</li>
  <li><b>Where to see them.</b> The <b>+ IR stash</b> chip on the Board filters to eligible players. The Intel tab has an <b>IR stash candidates</b> table with status, ADP, and availability. A green <span class="tag stash">free stash</span> tag appears on the board when you have an open slot and you're within four rounds of the end.</li>
  <li><b>Your roster math ignores them.</b> A stashed player doesn't count toward your position counts, so the app won't think you're set at running back because you're holding an injured one. The Mine tab shows the IR slot separately and reminds you, after the draft, who to move there.</li>
  <li><b>Return outlook is on every injured player.</b> Open any player card and you get his ESPN injury status, the actual beat-reporter note, and the date it was filed. The label above it is derived from that note: <b>Back Wk5+</b> means he is on IR with a designation to return or on reserve/PUP, both of which must sit the first four games, so Week 5 is the earliest he can play. <b>No timetable</b> means the team has not committed to one. <b>Nearing return</b> means reporting says he is close. <b>Out for season</b> means don't bother. The same outlook shows in the IR stash table on Intel and in the tag tooltip on the board.</li>
  <li><b>Pick the right stash.</b> Prefer a player expected back well before your playoff weeks (${S.playoff.join('/')}) with a clear path to touches. A season-ending ACL is a wasted pick; a designated-to-return starter back by Week 5 is a steal. The notes are dated, so on draft night trust anything newer that you hear over what the app shows.</li>
  </ul></section>

  <section class="card" id="h-share"><h2>Sharing and the live board</h2>
  <p>Anyone invited to the app gets the same rankings, projections, schedules and analysis. On their first visit they tap their name from the league list, and the whole app is then built for their team. Their targets, notes and settings are their own.</p>
  <p><b>The live board</b> makes the <i>pick log</i> shared. One person is the scorekeeper and logs every pick; everyone else follows and watches the board fill in automatically, with no refresh, usually within a second. Followers can't log picks, which is what stops the board being double-entered. Everything else stays personal: a follower's recommendations, availability odds and roster are computed for <i>their</i> slot, off the shared picks.</p>
  <ul>
  <li><b>Set-up is one tap.</b> A new person opens the link and taps their team. The app works out who is keeping score from the board itself, so nobody is asked.</li>
  <li><b>The pill in the header</b> reads &#9679; Live when connected. Hover it for the room name, pick count, and who logged last.</li>
  <li><b>Team names sync.</b> The scorekeeper types all ${T()} names in draft order and everyone else receives that list. Names save as you type — there is no button to press.</li>
  <li><b>Only the scorekeeper can change the board.</b> Everyone else sees it read-only: no Take or Gone buttons, no Undo, no Clear draft, no keeper edits, nothing to change in the shared-board settings.</li>
  <li><b>If the scorekeeper drops out,</b> anyone can switch to &ldquo;Log picks&rdquo; in Setup and carry on from the current board.</li>
  <li><b>Privacy:</b> the shared picks are visible to everyone invited. Your own team name, slot, targets, notes and photo never leave your browser.</li>
  <li><b>Turn it off</b> in Setup and the app goes back to a private draft in your browser alone.</li>
  </ul></section>

  <section class="card" id="h-mine"><h2>Mine tab</h2>
  <p>Your roster auto-filled into starting slots by value (best RB in RB, next in RB, third into flex, and so on). Projected starter points, playoff softness average, and a bye grid: yellow = two starters share the week, red = three or more. Below that, every starter's playoff-week opponents, then <b>Handcuffs & stacks</b>: the backup to each RB you own with his availability odds, and any receivers who share a team with your QB.</p></section>

  <section class="card" id="h-picks"><h2>Picks tab and league grades</h2>
  <p>The full draft log by round, keepers listed at the top, Undo and Clear. Once picks exist, <b>League grades so far</b> ranks every team by projected starter points from their auto-set lineup, with bench points, bye clashes, playoff softness, and each team's biggest steal (the pick that fell furthest past its ADP). Mid-draft it shows who's stacking and who's behind; after the draft it's the recap.</p></section>

=== HOW THE APP'S NUMBERS ARE BUILT (trust them, and know their limits) ===
- ECR: FantasyPros expert consensus rank, half-PPR, with each expert's min-max range; wide range = experts disagree = risk. Tiers are FantasyPros tiers; the drop between tiers matters more than rank order inside one.
- ADP: Yahoo first (what this league's drafters see), else FantasyFootballCalculator, else Sleeper. "value" tag = ECR at least 8 better than ADP (falls to us); "market high" = drafted 8+ spots earlier than experts rank (don't reach).
- proj: Sleeper/Rotowire season points re-scored to our settings. VORP = proj minus the last usable starter at the position (QB${Math.round(14*f)}, RB${Math.round(34*f)}, WR${Math.round(34*f)}, TE${Math.round(14*f)}). draftval = proj minus a waiver-wire baseline (QB${Math.round(22*f)}, RB${Math.round(56*f)}, WR${Math.round(64*f)}, TE${Math.round(22*f)}) — the number the recommender actually uses so late-round players don't all read zero.
- avail@N: probability the player is still on the board at pick N — a normal model on his ADP with the real spread of where he gets taken, conditioned on his still being available now. Above 70% = you can wait; under 35% = now or never.
- playoffSOS: matchup softness 0-100 for our playoff weeks; 65% what that defense allowed to the position per game last season, 35% this season's defense outlook. A tiebreaker between similar players, never a reason to reach.
- App recommendation score = need x (0.5 x draftval + 0.5 x [draftval - expected best draftval at that position at my next pick]). The second term is the cost of waiting. need: open starting slot x1.15 (x1.6 from round 6), flex open x1.0, bench x0.85, backup QB/TE x0.35-0.5, third QB/TE x0.05, K/DST x0.03 until three rounds from the end then x0.6 then x2.5, and x0 once we own one. Targets x1.25, avoids x0.3, RB handcuff of ours x1.1 from round 7, receiver stacking our QB x1.05, Doubtful x0.7. IR-eligible (IR/PUP/NFI) with an open IR slot: x1.2 in the last three rounds, x0.8 mid, x0.5 early; with the IR slot full x0.3.
- Injury outlook: each injured player carries his ESPN status, a dated beat-reporter note, and a return label (Back Wk5+ = IR-designated-to-return or reserve/PUP, which by rule miss the first four games; No timetable; Nearing return; Out for season). Quote the note and its date when it matters, and never invent a return week the note does not state.
- Limits: the data is a snapshot from ${D.meta.built}; you cannot browse; Sleeper "Questionable" tags in preseason are mostly noise; the availability model assumes drafters behave like Yahoo at large — the "teams picking before me" list and mock results are the correction for this league's actual behavior.

=== DRAFTING PRINCIPLES WE FOLLOW ===
1. Starters before bench; never finish with a starting hole. 2. In a ${T()}-team half-PPR league RB scarcity is real and WR is deep — the RB cliff usually hits around the tier-3 boundary; elite TE is worth an early pick only when his VORP clearly beats the RB/WR alternatives. 3. One QB unless a top-tier QB falls to a spot where his VORP wins; a backup QB only after round 11. 4. K and DST in the last two rounds, best playoff schedule wins. 5. Avoid three starters on one bye; two is fine. 6. When a run starts, either grab the last good one in the tier or zag to the position being ignored — don't be third in line. 7. Between our picks, count the intervening teams' needs: if six of them need an RB, our RB target is gone. 8. Age, rookie status, depth chart and injury tags are risk, not verdicts. 9. The IR slot is free real estate: in the last two or three rounds an IR/PUP player who returns by midseason is worth more than a healthy 14th-string bench body, because he costs no bench spot. Never spend an early or mid pick on one, never stash more injured players than we have IR slots, and prefer one who is back before weeks ${S.playoff.join('-')}.

function openChat(){ if(!sampleFn) return; const ch=$('#chat'); ch.classList.add('open'); ch.setAttribute('aria-hidden','false'); const ta=$('#chatIn'); if(ta&&innerWidth>900) ta.focus(); }
function closeChat(){ const ch=$('#chat'); ch.classList.remove('open'); ch.setAttribute('aria-hidden','true'); }
async function chatSend(text){ text=String(text||'').trim(); if(!sampleFn||!text||chatBusy) return; const ta=$('#chatIn'); if(ta){ ta.value=''; ta.style.height='auto'; }
  chatTurns.push({role:'user',content:text}); saveChat(); addBubble('user',text); const bubble=addBubble('assistant','Thinking…','busy'); setChatBusy(true); chatCtl=new AbortController();
  const input=[{role:'user',content:CHAT_RULES()+'\n\n=== LIVE DRAFT STATE ===\n'+chatContext()+'\n=== END STATE ==='}, ...chatTurns.slice(-12)];
  const opts={cache:false, signal:chatCtl.signal, modelTier:chatTier, onText:({text})=>{ bubble.classList.remove('busy'); bubble.textContent=text; const m=$('#chatMsgs'); m.scrollTop=m.scrollHeight; }};
  if(sampleLimits&&sampleLimits.tools) opts.tools=chatTools();
  try{ const r=await sampleFn(input,opts); bubble.classList.remove('busy'); bubble.textContent=r.text+(r.truncated?'\n\n[cut short — ask for less at a time]':''); chatTurns.push({role:'assistant',content:r.text}); saveChat(); }
  catch(e){ bubble.classList.remove('busy'); const code=e&&e.code||'upstream_error';
    if(code==='cancelled'){ bubble.textContent=(e.text?e.text+' ':'')+'(stopped)'; if(e.text){ chatTurns.push({role:'assistant',content:e.text}); saveChat(); } }
    else if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){ bubble.textContent='Claude access is off for this page (declined or unavailable on this account). Reload to be asked again.'; }
    else { const msg={rate_limited:'Too many questions at once. Give it a moment and ask again.', session_expired:'Your claude.ai session expired. Sign in again, then retry.', prompt_too_large:'Too much context for one question. Ask something shorter.', refused:'Claude declined that one. Rephrase and try again.', empty_completion:'No answer came back. Try again.', tools_unavailable:'Page tools are not available here; asking again without them.'}[code]||('Something went wrong ('+code+'). Try again.'); bubble.textContent=(e.text?e.text+'\n\n':'')+msg; if(code==='tools_unavailable') sampleLimits={...(sampleLimits||{}),tools:undefined}; } }
  finally{ chatCtl=null; setChatBusy(false); const m=$('#chatMsgs'); if(m) m.scrollTop=m.scrollHeight; } }

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{ const t=e.target.closest('[data-tab],[data-open],[data-draft],[data-undraft],[data-mark],[data-keeperdel],[data-kp],[data-tip],#simRun,#undo,#sheetbg,#fab');
  if(!t) return;
  if(t.id==='sheetbg') return closeSheet();
  if(t.id==='fab'){ openChat(); return; }
  if(t.id==='undo') return undo();
  if(t.id==='simRun'){ const sel=$('#simForce'); simForce=sel?sel.value:''; t.disabled=true; t.textContent='Running…'; setTimeout(()=>{ lastSim=simulate(200, simForce?+simForce:null); render(); const sc=$('#simcard'); if(sc) sc.scrollIntoView({block:'start'}); toast('200 mocks done'); },30); return; }
  if(t.dataset.mark){ const pid=+t.dataset.pid; const cur_=S.marks[pid]; if(cur_===t.dataset.mark) delete S.marks[pid]; else S.marks[pid]=t.dataset.mark; render(); openSheet(pid); toast(S.marks[pid]?(S.marks[pid]==='target'?'★ Target added':'✕ Avoid added'):'Cleared'); return; }
  if(t.dataset.keeperdel){ if(!isBoardOwner()||!canLog()) return; const pid=+t.dataset.keeperdel; S.keepers=S.keepers.filter(k=>k.pid!==pid); closeSheet(); render(); pushRoom(); toast('Keeper removed'); return; }
  if(t.dataset.kp){ const pid=+t.dataset.kp; const team=+($('#kpTeam')||{}).value||1; if(!drafted.has(pid)){ S.keepers.push({pid,team}); render(); pushRoom(); toast(`${byId.get(pid).name} kept by ${teamName(team)}`); } return; }
  const tipEl=t.closest&&t.closest('[data-tip]'); if(tipEl&&!t.closest('button,select,input,a,.brow:not(.head),.rec,.slot')){ toast(tipEl.dataset.tip); return; }
  if(t.dataset.tab){ S.tab=t.dataset.tab; render(); window.scrollTo(0,0); return; }
  if(t.dataset.draft){ draftPlayer(+t.dataset.draft,+t.dataset.team); return; }
  if(t.dataset.undraft){ if(!isBoardOwner()||!canLog()) return; const pid=+t.dataset.undraft; const i=S.picks.findIndex(pk=>pk.pid===pid); if(i>=0){ if(i!==S.picks.length-1&&!confirm('This is not the latest pick. Removing it shifts every later pick up one slot. Continue?')) return; S.picks.splice(i,1); closeSheet(); render(); pushRoom(); toast('Pick removed'); } return; }
  if(t.dataset.open){ openSheet(+t.dataset.open); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeSheet(); if(!chatBusy) closeChat(); } if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){ e.preventDefault(); S.tab='board'; render(); const q=$('#q'); if(q) q.focus(); } });
try{ const th=localStorage.getItem(KEY+'-theme'); if(th) document.documentElement.setAttribute('data-theme',th); }catch(e){}
if(location.search.indexOf('devdb=1')>=0 && typeof window.claude==='undefined'){   // local two-tab test harness only
  const K='devdb:';
  window.claude={use:async n=>{ if(n!=='db') return null; return {doc:path=>({
    get:async()=>{ const v=localStorage.getItem(K+path); return {exists:!!v,data:()=>v?JSON.parse(v):undefined}; },
    set:async data=>{ localStorage.setItem(K+path,JSON.stringify(data)); },
    onSnapshot:(next)=>{ let last;
      const emit=()=>{ const v=localStorage.getItem(K+path); if(v===last) return; last=v; next({exists:!!v,data:()=>v?JSON.parse(v):undefined}); };
      const h=e=>{ if(e.key===K+path) emit(); };
      window.addEventListener('storage',h); const t=setInterval(emit,400); setTimeout(emit,10);
      return ()=>{ window.removeEventListener('storage',h); clearInterval(t); }; }
  })}; }};
}
render(); roomConnect();
})();
</script>
